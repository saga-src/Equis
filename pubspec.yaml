name: equis
description: "Privacy-first, local-first personal finance for Windows and Android."
publish_to: 'none'
version: 1.0.0+6

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: 1.0.8
  flutter_riverpod: 2.6.1
  decimal: 3.2.5
  drift: 2.34.3
  drift_flutter: 0.3.1
  go_router: 17.5.0
  http: 1.6.0
  intl: 0.20.2
  logging: 1.3.0
  path_provider: 2.1.6
  sqlite3: 3.5.0
  timezone: 0.11.1
  uuid: 4.6.0
  flutter_secure_storage: 10.0.0
  shared_preferences: 2.5.5
  cryptography: 2.9.0
  cryptography_flutter: 2.3.4
  fl_chart: 1.2.0
  supabase_flutter: 2.17.2
  archive: 4.1.0
  file_selector: 1.1.0
  workmanager: 0.10.9
  connectivity_plus: 7.3.1

  path: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: 2.15.1
  drift_dev: 2.34.3
  flutter_lints: 6.0.0
  mocktail: 1.0.5

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/licenses/
    - assets/branding/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
    - family: Geist Sans
      fonts:
        - asset: assets/fonts/Geist-Variable.ttf
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
